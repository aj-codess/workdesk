services:
  db:
    image: postgres:16-alpine
    container_name: workdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workdesk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-workdesk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - workdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  workdesk_pgdata:
